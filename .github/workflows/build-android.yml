name: Build ArbScout APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phone-friendly: upload arbscout-starter.zip to the repository root and this step unpacks it.
      # If the zip is present it always wins, so an older android/ folder can never be built by mistake.
      - name: Unpack phone-uploaded source ZIP
        shell: bash
        run: |
          if [ -f arbscout-starter.zip ]; then
            rm -rf android
            unzip -q -o arbscout-starter.zip -d "$RUNNER_TEMP/arbscout-source"
            cp -a "$RUNNER_TEMP/arbscout-source/arbscout/android" ./android
          fi
          if [ ! -f android/settings.gradle ]; then
            echo "::error::No android/ project found. Upload arbscout-starter.zip to the repository root (same level as README)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build installable APK
        run: gradle -p android --no-daemon assembleDebug

      # Uploaded before the checks below, so a failing test or lint rule can never block you from getting the app.
      - uses: actions/upload-artifact@v4
        with:
          name: ArbScout-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: gradle -p android --no-daemon testDebugUnitTest
      - name: Lint
        if: ${{ !cancelled() }}
        run: gradle -p android --no-daemon lintDebug
